<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart Greenhouse Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17b6d4">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #bfe9ff;
    --sky-bot: #eaffe0;
    --glass: rgba(255,255,255,0.4);
    --glass-edge: rgba(255,255,255,0.8);
    --aqua: #17b6d4;
    --aqua-dark: #0e8ba3;
    --leaf: #4caf3c;
    --leaf-dark: #2e8b1f;
    --ink: #164a2e;
    --ink-dim: #3d6b52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, #d9f6e8 55%, var(--sky-bot) 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }

  .bubble {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 8%, rgba(255,255,255,0.05) 16%, transparent 22%),
      radial-gradient(circle at 50% 50%, rgba(150,220,255,0.12) 55%, rgba(120,200,255,0.28) 78%, rgba(255,255,255,0.7) 92%, rgba(255,255,255,0.9) 100%);
    box-shadow: inset 0 0 18px rgba(255,255,255,0.5), 0 6px 20px rgba(20,90,60,0.12);
    z-index: 0;
  }
  .bub1 { width: 90px; height: 90px; top: 4%; left: 4%; }
  .bub2 { width: 40px; height: 40px; top: 12%; right: 8%; }
  .bub3 { width: 24px; height: 24px; bottom: 30%; left: 3%; }

  .container { max-width: 460px; margin: 0 auto; position: relative; z-index: 1; }

  h1 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 26px;
    text-align: center;
    margin-bottom: 6px;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }

  .conn-status { text-align: center; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 22px; }

  .card {
    position: relative;
    background: var(--glass);
    border: 1.5px solid var(--glass-edge);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 18px;
    backdrop-filter: blur(8px);
    box-shadow: 0 16px 34px -16px rgba(20,90,60,0.3), inset 0 1px 0 rgba(255,255,255,0.8);
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.1) 80%, transparent 100%);
    pointer-events: none;
  }

  .card > * { position: relative; z-index: 1; }

  .moisture-value {
    font-family: 'Quicksand', sans-serif;
    font-size: 46px;
    font-weight: 700;
    text-align: center;
    margin: 4px 0;
    color: var(--aqua-dark);
  }

  .label {
    color: var(--ink-dim);
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
  }

  .status-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 0; font-size: 14px; }
  .status-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .dot-on { background: #34d399; box-shadow: 0 0 8px #34d399; }
  .dot-off { background: #a3b3ac; }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 100px;
    border: none;
    font-family: 'Quicksand', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,40,50,0.35);
    position: relative;
    overflow: hidden;
    transition: transform 0.1s ease;
  }
  button::before {
    content: '';
    position: absolute; top: 12%; left: 8%; right: 8%; height: 35%;
    background: rgba(255,255,255,0.5);
    border-radius: 100px;
    pointer-events: none;
  }
  button:active { transform: translateY(2px); }

  .btn-water {
    background: linear-gradient(180deg, #6fe0f5 0%, var(--aqua) 55%, var(--aqua-dark) 100%);
    box-shadow: 0 5px 0 var(--aqua-dark), 0 8px 16px -6px rgba(14,139,163,0.5);
  }

  input[type="time"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.5);
    color: var(--ink);
    font-size: 15px;
    margin-bottom: 10px;
  }

  .schedule-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(22,74,46,0.12);
    font-size: 14px;
  }
  .schedule-item:last-child { border-bottom: none; }
  .remove-btn {
    background: none;
    border: none;
    color: #d9534f;
    font-size: 13px;
    font-weight: 600;
    width: auto;
    padding: 4px 8px;
    margin: 0;
    box-shadow: none;
    text-shadow: none;
  }
  .remove-btn::before { display: none; }
</style>
</head>
<body>

<div class="bubble bub1"></div>
<div class="bubble bub2"></div>
<div class="bubble bub3"></div>

<div class="container">
  <h1>Smart Greenhouse</h1>
  <div class="conn-status" id="connStatus">Connecting...</div>

  <div class="card">
    <div class="label">Soil Moisture Reading</div>
    <div class="moisture-value" id="moistureVal">--</div>
    <div class="status-row">
      <span><span class="status-dot" id="pumpDot"></span>Pump</span>
      <span id="pumpText">--</span>
    </div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:12px;">Moisture History</div>
    <canvas id="moistureChart" height="180"></canvas>
  </div>

  <div class="card">
    <button class="btn-water" id="dispenseBtn">Dispense Water Now</button>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:12px;">Watering Schedule</div>
    <input type="time" id="scheduleTime"/>
    <button class="btn-water" id="addScheduleBtn">+ Add Scheduled Time</button>
    <div id="scheduleList" style="margin-top:12px;"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getDatabase, ref, onValue, set, push, remove
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const connStatus = document.getElementById("connStatus");
  const moistureVal = document.getElementById("moistureVal");
  const pumpDot = document.getElementById("pumpDot");
  const pumpText = document.getElementById("pumpText");
  const dispenseBtn = document.getElementById("dispenseBtn");
  const scheduleTime = document.getElementById("scheduleTime");
  const addScheduleBtn = document.getElementById("addScheduleBtn");
  const scheduleList = document.getElementById("scheduleList");

  const moistureChart = new Chart(document.getElementById("moistureChart"), {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Soil Moisture',
        data: [],
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56,189,248,0.15)',
        tension: 0.3,
        fill: true,
        pointRadius: 0
      }]
    },
    options: {
      scales: {
        x: { ticks: { color: '#3d6b52', maxTicksLimit: 6 }, grid: { color: 'rgba(22,74,46,0.1)' } },
        y: { ticks: { color: '#3d6b52' }, grid: { color: 'rgba(22,74,46,0.1)' } }
      },
      plugins: { legend: { display: false } }
    }
  });

  signInAnonymously(auth).then(() => {

    onValue(ref(db, ".info/connected"), (snap) => {
      connStatus.textContent = snap.val() ? "🟢 Connected" : "🔴 Disconnected";
    });

    onValue(ref(db, "greenhouse/moisture"), (snap) => {
      moistureVal.textContent = snap.val() ?? "--";
    });

    onValue(ref(db, "greenhouse/pumpStatus"), (snap) => {
      const isOn = snap.val();
      pumpDot.className = "status-dot " + (isOn ? "dot-on" : "dot-off");
      pumpText.textContent = isOn ? "Running" : "Idle";
    });

    onValue(ref(db, "greenhouse/history"), (snap) => {
      const data = snap.val();
      if (!data) return;

      const entries = Object.entries(data)
        .map(([epoch, value]) => ({ epoch: Number(epoch), value }))
        .sort((a, b) => a.epoch - b.epoch);

      moistureChart.data.labels = entries.map(e =>
        new Date(e.epoch * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      );
      moistureChart.data.datasets[0].data = entries.map(e => e.value);
      moistureChart.update();
    });

    dispenseBtn.addEventListener("click", () => {
      set(ref(db, "greenhouse/manualDispense"), true);
      dispenseBtn.textContent = "Dispensing...";
      setTimeout(() => { dispenseBtn.textContent = "Dispense Water Now"; }, 3500);
    });

    addScheduleBtn.addEventListener("click", () => {
      if (!scheduleTime.value) return;
      const schedRef = push(ref(db, "greenhouse/schedule"));
      set(schedRef, { time: scheduleTime.value });
      scheduleTime.value = "";
    });

    onValue(ref(db, "greenhouse/schedule"), (snap) => {
      scheduleList.innerHTML = "";
      const data = snap.val();
      if (!data) return;
      Object.entries(data).forEach(([key, val]) => {
        const item = document.createElement("div");
        item.className = "schedule-item";
        item.innerHTML = `<span>${val.time}</span>`;
        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "Remove";
        removeBtn.onclick = () => remove(ref(db, "greenhouse/schedule/" + key));
        item.appendChild(removeBtn);
        scheduleList.appendChild(item);
      });
    });

  }).catch((err) => {
    connStatus.textContent = "🔴 Sign-in failed";
    console.error("Anonymous sign-in error:", err);
  });
</script>

</body>
</html>
