<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Greenhouse — Select Mode</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17b6d4">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #bfe9ff;
    --sky-bot: #eaffe0;
    --glass: rgba(255,255,255,0.35);
    --glass-edge: rgba(255,255,255,0.75);
    --leaf: #4caf3c;
    --leaf-dark: #2e8b1f;
    --aqua: #17b6d4;
    --aqua-dark: #0e8ba3;
    --ink: #164a2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--sky-top) 0%, #d9f6e8 55%, var(--sky-bot) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    overflow-x: hidden;
    position: relative;
  }

  .bubble {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 8%, rgba(255,255,255,0.05) 16%, transparent 22%),
      radial-gradient(circle at 68% 72%, rgba(255,255,255,0.25) 0%, transparent 10%),
      radial-gradient(circle at 50% 50%,
        rgba(200,240,255,0.05) 0%,
        rgba(150,220,255,0.12) 55%,
        rgba(120,200,255,0.28) 78%,
        rgba(255,255,255,0.7) 92%,
        rgba(255,255,255,0.9) 100%);
    box-shadow:
      inset 0 0 18px rgba(255,255,255,0.5),
      0 6px 20px rgba(20,90,60,0.12);
  }
  .bub1 { width: 130px; height: 130px; top: 6%; left: 5%; }
  .bub2 { width: 60px; height: 60px; top: 16%; left: 15%; }
  .bub3 { width: 38px; height: 38px; top: 4%; left: 20%; }
  .bub4 { width: 44px; height: 44px; top: 24%; right: 9%; }
  .bub5 { width: 84px; height: 84px; bottom: 8%; left: 3%; }
  .bub6 { width: 30px; height: 30px; bottom: 20%; left: 12%; }
  .bub7 { width: 56px; height: 56px; bottom: 12%; right: 5%; }
  .bub8 { width: 22px; height: 22px; top: 48%; left: 2%; }

  .sparkle {
    position: fixed;
    pointer-events: none;
  }
  .sparkle::before {
    content: '';
    position: absolute; inset: 0;
    background: #fff;
    clip-path: polygon(
      50% 0%, 61% 39%, 100% 50%, 61% 61%,
      50% 100%, 39% 61%, 0% 50%, 39% 39%
    );
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.9));
  }
  .sp1 { width: 16px; height: 16px; top: 10%; left: 10%; opacity: 0.9; }
  .sp2 { width: 12px; height: 12px; top: 22%; right: 13%; opacity: 0.85; }
  .sp3 { width: 20px; height: 20px; bottom: 10%; left: 8%; opacity: 0.8; }
  .sp4 { width: 10px; height: 10px; top: 6%; left: 24%; opacity: 0.7; }
  .sp5 { width: 14px; height: 14px; bottom: 16%; right: 6%; opacity: 0.85; }

  .stage { width: 100%; max-width: 1100px; position: relative; z-index: 2; }

  .cards {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .card {
    position: relative;
    width: 260px;
    height: 400px;
    border-radius: 26px;
    overflow: hidden;
    background: var(--glass);
    border: 1.5px solid var(--glass-edge);
    box-shadow:
      0 20px 45px -18px rgba(20, 90, 60, 0.35),
      inset 0 1px 0 rgba(255,255,255,0.8);
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: transform 0.25s ease;
    display: flex;
    align-items: flex-end;
  }

  .card:hover { transform: translateY(-6px); }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 46%;
    background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.12) 80%, transparent 100%);
    border-radius: 26px 26px 60% 60% / 26px 26px 30px 30px;
    z-index: 1;
  }

  .card.featured {
    border-color: rgba(255,255,255,0.95);
    box-shadow:
      0 26px 60px -16px rgba(14, 139, 163, 0.45),
      inset 0 1px 0 rgba(255,255,255,0.9);
  }

  .card-art { position: absolute; inset: 0; z-index: 0; }

  .card-soil .card-art {
    background: linear-gradient(180deg, #d8c39a 0%, #a97c4f 55%, #6b4423 100%);
  }
  .card-water .card-art {
    background: linear-gradient(180deg, #aef0ff 0%, #4bc6e0 55%, #0e8ba3 100%);
  }
  .card-dash .card-art {
    background: linear-gradient(200deg, #c9f7a8 0%, #6fd15a 45%, var(--leaf) 75%, var(--leaf-dark) 110%);
  }

  .drop { position: absolute; border-radius: 50% 50% 50% 0; transform: rotate(45deg); }
  .drop::after {
    content:'';
    position: absolute; top: 18%; left: 22%;
    width: 30%; height: 30%; border-radius: 50%;
    background: rgba(255,255,255,0.85);
  }
  .drop.d1 { width: 46px; height: 46px; top: 18%; left: 20%; background: radial-gradient(circle at 35% 30%, #eafeff, #6fd6ea 60%, #1c9bb8); }
  .drop.d2 { width: 30px; height: 30px; top: 34%; right: 22%; background: radial-gradient(circle at 35% 30%, #eafeff, #6fd6ea 60%, #1c9bb8); }
  .drop.d3 { width: 20px; height: 20px; top: 10%; right: 34%; background: radial-gradient(circle at 35% 30%, #eafeff, #6fd6ea 60%, #1c9bb8); }

  .leaf-shape {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 100px; background: linear-gradient(180deg, #eafbe0, #ffffff);
    border-radius: 6px;
  }
  .leaf-shape::before, .leaf-shape::after {
    content: ''; position: absolute; top: 10px; width: 58px; height: 34px;
    background: radial-gradient(circle at 30% 30%, #ffffff, #e3ffe0 70%);
    border-radius: 0 100% 0 100%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
  }
  .leaf-shape::before { left: -52px; transform: rotate(8deg); }
  .leaf-shape::after { right: -52px; transform: scaleX(-1) rotate(8deg); }

  .card-body {
    position: relative; z-index: 2;
    padding: 26px 24px 30px;
    width: 100%;
    background: linear-gradient(180deg, transparent 0%, rgba(10, 40, 25, 0.35) 75%);
  }

  .card-title {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0,40,20,0.35), 0 0 1px rgba(255,255,255,0.4);
  }

  .card-sub {
    margin-top: 8px;
    font-size: 13.5px;
    color: rgba(255,255,255,0.92);
    max-width: 200px;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,30,15,0.3);
  }

  .card-stat {
    margin-top: 14px;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: #ffffff;
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.5);
    padding: 4px 12px;
    border-radius: 100px;
    backdrop-filter: blur(3px);
  }

  .enter-btn {
    margin-top: 18px;
    display: inline-block;
    position: relative;
    background: linear-gradient(180deg, #6fe0f5 0%, var(--aqua) 55%, var(--aqua-dark) 100%);
    color: #ffffff;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 17px;
    padding: 11px 34px;
    border-radius: 100px;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 2px rgba(0,40,50,0.4);
    box-shadow:
      0 6px 0 var(--aqua-dark),
      0 10px 18px -6px rgba(14,139,163,0.6),
      inset 0 1px 0 rgba(255,255,255,0.8);
    overflow: hidden;
  }
  .enter-btn::before {
    content: '';
    position: absolute; top: 8%; left: 8%; right: 8%; height: 38%;
    background: rgba(255,255,255,0.55);
    border-radius: 100px;
  }
  .card.featured:hover .enter-btn {
    transform: translateY(2px);
    box-shadow:
      0 4px 0 var(--aqua-dark),
      0 6px 12px -6px rgba(14,139,163,0.6),
      inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .prompt {
    text-align: center;
    margin-top: 42px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: 0.3px;
  }

  .footer-row {
    margin-top: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 1100px;
    font-size: 13px;
    color: #3d6b52;
  }
  .footer-row b { color: var(--ink); font-weight: 700; }

  .brand { display: flex; gap: 8px; align-items: center; opacity: 0.65; font-size: 12px; letter-spacing: 0.5px; }

  @media (max-width: 620px) {
    .cards { gap: 16px; }
    .card { width: 44vw; height: 320px; }
    .card.featured { width: 92vw; order: -1; }
  }
</style>
</head>
<body>

  <div class="bubble bub1"></div>
  <div class="bubble bub2"></div>
  <div class="bubble bub3"></div>
  <div class="bubble bub4"></div>
  <div class="bubble bub5"></div>
  <div class="bubble bub6"></div>
  <div class="bubble bub7"></div>
  <div class="bubble bub8"></div>


  <div class="stage">
    <div class="cards">

      <div class="card card-soil">
        <div class="card-art"></div>
        <div class="card-body">
          <div class="card-title">Soil<br/>Status</div>
          <div class="card-sub">Live moisture readings from the bed.</div>
          <div class="card-stat" id="soilStat">-- </div>
        </div>
      </div>

      <div class="card card-water">
        <div class="card-art">
          <div class="drop d1"></div>
          <div class="drop d2"></div>
          <div class="drop d3"></div>
        </div>
        <div class="card-body">
          <div class="card-title">Water<br/>Control</div>
          <div class="card-sub">Dispense now, or set a routine.</div>
          <div class="card-stat" id="waterStat">No schedule set</div>
        </div>
      </div>

      <div class="card card-dash featured">
        <div class="card-art"><div class="leaf-shape"></div></div>
        <div class="card-body">
          <div class="card-title">Dashboard</div>
          <div class="card-sub">Your soil. Your schedule. Your greenhouse.</div>
          <a href="greenhouse-dashboard.html" class="enter-btn">Enter</a>
        </div>
      </div>

    </div>

    <div class="prompt">Choose where to start</div>

    <div class="footer-row">
      <div>Connected as: <b>Greenhouse–ESP32</b></div>
      <div class="brand">ESP32 · Firebase</div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const soilStat = document.getElementById("soilStat");
  const waterStat = document.getElementById("waterStat");

  signInAnonymously(auth).then(() => {

    onValue(ref(db, "greenhouse/pumpStatus"), (snap) => {
      const isDry = snap.val();
      onValue(ref(db, "greenhouse/moisture"), (moistureSnap) => {
        const val = moistureSnap.val();
        if (val == null) { soilStat.textContent = "No reading yet"; return; }
        soilStat.textContent = (isDry ? "Dry" : "Moist") + " · " + val;
      }, { onlyOnce: true });
    });

    onValue(ref(db, "greenhouse/schedule"), (snap) => {
      const data = snap.val();
      if (!data) { waterStat.textContent = "No schedule set"; return; }

      const times = Object.values(data).map(entry => entry.time).filter(Boolean);
      if (times.length === 0) { waterStat.textContent = "No schedule set"; return; }

      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const toMinutes = (t) => {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      };

      const upcoming = times
        .map(t => ({ t, mins: toMinutes(t) }))
        .sort((a, b) => a.mins - b.mins);

      const next = upcoming.find(e => e.mins >= nowMinutes) || upcoming[0];
      waterStat.textContent = "Next: " + next.t;
    });

  }).catch((err) => {
    soilStat.textContent = "Sign-in failed";
    console.error("Anonymous sign-in error:", err);
  });
</script>

</body>
</html>
